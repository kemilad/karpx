# ──────────────────────────────────────────────────────────────────────────
# Generated by karpx
# Mode         : Cost-Optimized (Spot + Graviton where available)
# Workload     : cpu
# Provider     : AWS EKS
#
# Why these instance families:
# • Compute-intensive workloads (<2 GiB/core) — compute-optimised families (c-series)
# • Graviton c7g/c6g offer best compute $/vCPU on Spot

# ──────────────────────────────────────────────────────────────────────────
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: karpx-default
  annotations:
    karpx.io/generated-mode: "cost"
    karpx.io/workload-type: "cpu"
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: karpx-default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64", "amd64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c7g", "c6g", "c7i", "c6i", "c6a"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4", "8", "16", "32", "48", "64"]
        - key: karpenter.k8s.aws/instance-memory
          operator: Gt
          values: ["2048"]
  limits:
    cpu: "1000"
    memory: 4000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: karpx-default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: "karpx-test-karpenter-node"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "karpx-test"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "karpx-test"
  tags:
    ManagedBy: karpx
    OptimizationMode: "cost"
